  <text x="170" y="40" fill="#212529" font-size="18" font-weight="700">Parametrizações</text>

  <!-- Card Produtos -->
  <rect x="170" y="60" width="630" height="150" rx="10" fill="#ffffff" stroke="#dee2e6"/>
  <rect x="170" y="60" width="4" height="40" fill="#0d6efd"/>
  <text x="188" y="85" fill="#212529" font-size="14" font-weight="700">Produtos</text>
  <line x1="170" y1="100" x2="800" y2="100" stroke="#eee"/>
  <rect x="188" y="116" width="380" height="30" rx="4" fill="#fff" stroke="#ced4da"/>
  <text x="200" y="135" fill="#adb5bd" font-size="12">Novo produto (ex: FXO)</text>
  <rect x="576" y="116" width="120" height="30" rx="6" fill="#0d6efd"/>
  <text x="636" y="135" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">+ Adicionar</text>
  <circle cx="196" cy="131" r="12" fill="#fd7e14"/><text x="196" y="135" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">1</text>
  <circle cx="636" cy="100" r="12" fill="#fd7e14"/><text x="636" y="104" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">2</text>
  <!-- lista -->
  <rect x="188" y="164" width="52" height="24" rx="6" fill="#f1f3f5" stroke="#dee2e6"/><text x="214" y="180" fill="#495057" font-size="12" text-anchor="middle">NDF</text>
  <rect x="248" y="164" width="60" height="24" rx="6" fill="#f1f3f5" stroke="#dee2e6"/><text x="278" y="180" fill="#495057" font-size="12" text-anchor="middle">SWAP</text>
  <rect x="316" y="164" width="120" height="24" rx="6" fill="#e7f1ff" stroke="#9ec5fe"/><text x="376" y="180" fill="#0d6efd" font-size="12" font-weight="700" text-anchor="middle">FXO ← novo</text>

  <!-- Card Domínios -->
  <rect x="170" y="222" width="630" height="150" rx="10" fill="#ffffff" stroke="#dee2e6"/>
  <rect x="170" y="222" width="4" height="40" fill="#0d6efd"/>
  <text x="188" y="247" fill="#212529" font-size="14" font-weight="700">Domínios</text>
  <line x1="170" y1="262" x2="800" y2="262" stroke="#eee"/>
  <rect x="188" y="278" width="380" height="30" rx="4" fill="#fff" stroke="#ced4da"/>
  <text x="200" y="297" fill="#adb5bd" font-size="12">Novo domínio (ex: Posição)</text>
  <rect x="576" y="278" width="120" height="30" rx="6" fill="#0d6efd"/>
  <text x="636" y="297" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">+ Adicionar</text>
  <text x="188" y="334" fill="#495057" font-size="12">Posição</text>
  <text x="188" y="354" fill="#495057" font-size="12">Liquidação</text>

  <text x="170" y="398" fill="#6c757d" font-size="11">Cadastre aqui o Produto e o Domínio novos antes de criar o roteiro contábil.</text>
