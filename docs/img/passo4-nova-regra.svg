<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family="Segoe UI, Arial, sans-serif">
  <rect width="820" height="440" fill="#f8f9fa"/>
  <rect x="0" y="0" width="150" height="440" fill="#212529"/>
  <text x="18" y="34" fill="#ffffff" font-size="15" font-weight="700">SRCOff</text>
  <text x="18" y="76" fill="#adb5bd" font-size="12">Operação</text>
  <text x="18" y="104" fill="#adb5bd" font-size="12">Consulta</text>
  <text x="18" y="132" fill="#adb5bd" font-size="12">Posição</text>
  <rect x="8" y="148" width="134" height="26" rx="6" fill="#0d6efd"/>
  <text x="18" y="165" fill="#ffffff" font-size="12" font-weight="600">Regras</text>
  <text x="18" y="192" fill="#adb5bd" font-size="12">Parametrizações</text>

  <text x="170" y="40" fill="#212529" font-size="18" font-weight="700">Regras Contábeis</text>
  <rect x="686" y="26" width="114" height="26" rx="5" fill="#0d6efd"/>
  <text x="743" y="43" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">+ Nova Regra</text>
  <circle cx="694" cy="20" r="12" fill="#fd7e14"/><text x="694" y="24" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">1</text>

  <!-- Modal -->
  <rect x="210" y="62" width="560" height="360" rx="12" fill="#ffffff" stroke="#dee2e6"/>
  <text x="234" y="92" fill="#212529" font-size="15" font-weight="700">Nova Regra</text>
  <line x1="210" y1="104" x2="770" y2="104" stroke="#eee"/>

  <text x="234" y="128" fill="#495057" font-size="11">Descrição</text>
  <rect x="234" y="134" width="512" height="30" rx="4" fill="#fff" stroke="#ced4da"/>
  <text x="246" y="153" fill="#212529" font-size="12">FXO - Registro de Notional</text>

  <text x="234" y="186" fill="#495057" font-size="11">Produtos (selecione um ou mais)</text>
  <rect x="234" y="192" width="250" height="30" rx="4" fill="#fff" stroke="#ced4da"/>
  <rect x="242" y="198" width="42" height="18" rx="4" fill="#0d6efd"/><text x="263" y="211" fill="#fff" font-size="11" text-anchor="middle">FXO</text>
  <text x="512" y="186" fill="#495057" font-size="11">Domínios</text>
  <rect x="512" y="192" width="234" height="30" rx="4" fill="#fff" stroke="#ced4da"/>
  <rect x="520" y="198" width="60" height="18" rx="4" fill="#0d6efd"/><text x="550" y="211" fill="#fff" font-size="11" text-anchor="middle">Posição</text>
  <circle cx="484" cy="207" r="12" fill="#fd7e14"/><text x="484" y="211" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">2</text>

  <text x="234" y="244" fill="#495057" font-size="11">Campo Data (coluna do arquivo com a data da posição)</text>
  <rect x="234" y="250" width="250" height="30" rx="4" fill="#fff" stroke="#ced4da"/>
  <text x="246" y="269" fill="#212529" font-size="12">data_posicao</text>

  <text x="512" y="244" fill="#495057" font-size="11">Pré Condição (opcional)</text>
  <rect x="512" y="250" width="234" height="30" rx="4" fill="#fff" stroke="#ced4da"/>
  <text x="524" y="269" fill="#212529" font-size="11">descricao_veiculo == 'NASSAU'</text>

  <rect x="234" y="300" width="16" height="16" rx="3" fill="#0d6efd"/><text x="240" y="313" fill="#fff" font-size="12" text-anchor="middle">✓</text>
  <text x="258" y="313" fill="#212529" font-size="12">Posta/Reverte (estorna os lançamentos no dia seguinte)</text>

  <line x1="210" y1="336" x2="770" y2="336" stroke="#eee"/>
  <rect x="640" y="350" width="106" height="32" rx="6" fill="#0d6efd"/>
  <text x="693" y="371" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Criar</text>
  <circle cx="648" cy="346" r="12" fill="#fd7e14"/><text x="648" y="350" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">3</text>
</svg>
